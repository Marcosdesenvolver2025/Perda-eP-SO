name: Build APK

on:
  push:
    branches: [ musibox ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musibox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Testes unitários
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest 2>&1 | tee unit-tests.log

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: Testar regras do Firestore (emulador)
        id: rules
        if: always()
        continue-on-error: true
        working-directory: rules-test
        run: |
          set -o pipefail
          cp ../firestore.rules .
          npm install --no-audit --no-fund 2>&1 | tail -n 5
          npx firebase emulators:exec --only firestore --project demo-musibox "node --test" 2>&1 | tee ../rules-tests.log

      - name: Publicar resultado no branch builds
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp unit-tests.log out/ 2>/dev/null || true
          cp rules-tests.log out/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} out/ \; 2>/dev/null || true
          for f in app/build/outputs/apk/release/*arm*.apk; do [ -f "$f" ] && cp "$f" out/; done
          {
            echo "commit=${GITHUB_SHA}"
            echo "build=${{ steps.build.outcome }}"
            echo "unit=${{ steps.unit.outcome }}"
            echo "rules=${{ steps.rules.outcome }}"
          } > out/STATUS
          ls -la out
          cd out
          git init -q
          git config user.name "musibox-ci"
          git config user.email "musibox-ci@users.noreply.github.com"
          git checkout -q -b musibox-builds
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" musibox-builds > ../push.log 2>&1 || cat ../push.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusiBox-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Relatório no commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### build=${{ steps.build.outcome }} unit=${{ steps.unit.outcome }} rules=${{ steps.rules.outcome }}"
            echo '```'
            grep -E "^e: |^w: .*(deprecated in favor|unresolved)|error:|FAILED|What went wrong|Could not (resolve|find|get)|Execution failed" build.log 2>/dev/null | grep -v "^w:" | head -200
            echo '```'
            echo "#### Final do log"
            echo '```'
            tail -40 build.log 2>/dev/null
            echo '```'
            echo "#### Testes"
            echo '```'
            grep -E "FAILED|tests completed|BUILD" unit-tests.log 2>/dev/null | head -40
            grep -E "^# (pass|fail)|^not ok|^ok" rules-tests.log 2>/dev/null | head -40
            echo '```'
            echo "#### Publicação"
            echo '```'
            cat push.log 2>/dev/null | tail -10
            echo '```'
          } > report.md
          head -c 60000 report.md > r.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat r.md)" > /dev/null

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MusiBox-APK
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar ffmpeg (arquivos de teste)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Assinar APK de teste (chave temporária do CI)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore /tmp/ci.jks -storepass android -keypass android -alias ci \
            -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=MusiBox CI" > /dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/ci.jks --ks-pass pass:android --out apk/teste.apk apk/*x86_64*.apk
          ls -la apk

      - name: Teste no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: Relatório do emulador no commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### smoke"
            echo '```'
            cat smoke-out/steps.log 2>/dev/null | tail -80
            echo '```'
            echo '```'
            head -80 smoke-out/crashes.txt 2>/dev/null
            echo '```'
          } > r.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 r.md)" > /dev/null

      - name: Publicar prints no branch smoke
        if: always()
        run: |
          [ -d smoke-out ] || exit 0
          cd smoke-out
          git init -q
          git config user.name "musibox-ci"
          git config user.email "musibox-ci@users.noreply.github.com"
          git checkout -q -b musibox-smoke
          git add -A
          git commit -qm "smoke ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" musibox-smoke
