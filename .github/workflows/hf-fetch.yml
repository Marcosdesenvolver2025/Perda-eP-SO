name: Baixar imagens geradas

# Baixa as imagens geradas (lista em hf/manifest.json), converte para WebP e guarda no branch musibox-hf.
on:
  push:
    branches: [ musibox ]
    paths: [ 'hf/manifest.json' ]

permissions:
  contents: write

concurrency:
  group: hf-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar branch das imagens
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$REPO" musibox-hf >/dev/null; then
            git clone -q --depth 1 -b musibox-hf "https://x-access-token:$TOKEN@github.com/$REPO" store
          else
            mkdir store && cd store && git init -q && git checkout -q -b musibox-hf
            git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO"
          fi

      - name: Baixar e converter
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import io, json, os, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          m = json.load(open('src/hf/manifest.json'))
          os.makedirs('store/img', exist_ok=True)
          def get(item):
              name, url = item
              out = f'store/img/{name}.webp'
              if os.path.exists(out):
                  return None
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'musibox-ci'})
                  data = urllib.request.urlopen(req, timeout=180).read()
                  Image.open(io.BytesIO(data)).convert('RGB').save(out, 'WEBP', quality=92, method=6)
                  return None
              except Exception as e:
                  return f'{name}: {e}'
          with ThreadPoolExecutor(8) as ex:
              bad = [b for b in ex.map(get, m.items()) if b]
          open('store/FAILED.txt', 'w').write('\n'.join(bad) + '\n')
          print('total', len(m), 'falhas', len(bad))
          PY

      - name: Publicar
        run: |
          cd store
          git config user.name "musibox-ci"
          git config user.email "musibox-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "imagens $(ls img | wc -l)" || exit 0
          git push -q origin HEAD:musibox-hf
