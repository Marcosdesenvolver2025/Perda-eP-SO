org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Package do app (próprio, para não conflitar com outros apps instalados).
musibox.applicationId=br.com.musibox
# AdMob: troque pelos IDs reais quando tiver (vazios = IDs de teste do Google)
#musibox.admobAppId=ca-app-pub-XXXXXXXX~YYYYYYYY
#musibox.admobRewardedId=ca-app-pub-XXXXXXXX/ZZZZZZZZ
# Stripe (IDs dos preços do MusiBox Pró; não são segredos)
musibox.stripePrice3d=
musibox.stripePriceWeek=
musibox.stripePriceMonth=
musibox.stripeRegion=southamerica-east1
