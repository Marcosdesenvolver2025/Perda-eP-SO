org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Package do app (próprio, para não conflitar com outros apps instalados).
musibox.applicationId=br.com.musibox
# Anúncios Start.io (App ID do portal). adsTest=true mostra anúncios de teste; mude para false no lançamento.
musibox.startioAppId=209698277
musibox.adsTest=true
# Stripe (IDs dos preços do MusiBox Pró; não são segredos)
musibox.stripePrice3d=
musibox.stripePriceWeek=
musibox.stripePriceMonth=
musibox.stripeRegion=southamerica-east1
